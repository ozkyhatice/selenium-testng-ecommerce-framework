name: Selenium Test Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run Selenium Tests (Headless)
        run: mvn clean test -Dheadless=true
      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman API Tests
        run: |
          newman run "postman/collections/AutomationExercise_API.postman_collection.json" \
          -e "postman/environments/AutomationExercise.postman_environment.json" \
          --reporters cli
